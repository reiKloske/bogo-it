<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
    <title>Bogo-it!</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header-container">
        <div class="header-center-items">
            <span id="timer" class="header-item">0 days 00:00:00</span>
            <span class="loader"></span>
            <span id="shuffleCount" class="header-item">Shuffles: 0</span>
        </div>
    </div>
    <div class="confetti">
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>  
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
    </div>
    <label for="theme" class="theme">
        <span class="theme__toggle-wrap">
            <input id="theme" class="theme__toggle" type="checkbox" role="switch" name="theme" value="dark">
        </span>
    </label>
    <input type="checkbox" id="soundToggle">
    <label for="soundToggle" class="sound-toggle-switch">
        <div class="speaker">
            <svg xmlns="http://www.w3.org/2000/svg" version="1.0" viewBox="0 0 75 75">
                <path d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z" style="stroke-width:5;stroke-linejoin:round;"></path>
                <path d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6" style="fill:none;stroke-width:5;stroke-linecap:round"></path>
            </svg>
        </div>
        <div class="mute-speaker">
            <svg version="1.0" viewBox="0 0 75 75" stroke-width="5">
                <path d="m39,14-17,15H6V48H22l17,15z" stroke-linejoin="round"></path>
                <path d="m49,26 20,24m0-24-20,24" stroke-linecap="round"></path>
            </svg>
        </div>
    </label>
    <div class="popup-card sorted-card" id="sortedCard">
        <div class="popup-content">
            <p class="popup-title">The Array has been sorted!</p>
            <p id="sorted-on">On: {{ sorted_date }}</p>
            <button class="popup-btn" id="close-button">
                <span>Close</span>
            </button>
        </div>
    </div>
    <canvas id="bogoChart" width="400" height="180"></canvas>
    <div class="popup-card" id="funFactCard">
        <div class="popup-content">
            <p class="popup-title">Fun Fact</p>
            <p>This array will statistically never be sorted in our lifetime.</p>
            <p class="popup-subtitle">Expected time: ~1,243 years</p>
            <button class="popup-btn" id="funFactClose">
                <span>Got it!</span>
            </button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
