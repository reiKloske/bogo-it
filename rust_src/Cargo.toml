[package]
name = "bogo_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bogo_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
rand = { version = "0.8.5", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
